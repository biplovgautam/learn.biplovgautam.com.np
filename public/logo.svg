<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Black background with rounded corners -->
  <rect width="500" height="500" rx="80" fill="#000000"/>

  <!-- Bi text — bold white -->
  <g fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800">
    <text x="130" y="345" font-size="280" letter-spacing="-12">Bi</text>
  </g>

  <!-- Green stylized accent above the i (two bracket/chevron marks) -->
  <g fill="none" stroke="#4ade80" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- left bracket -->
    <polyline points="335,110 360,90 360,130"/>
    <!-- right bracket -->
    <polyline points="385,140 410,120 410,160"/>
  </g>
</svg>
